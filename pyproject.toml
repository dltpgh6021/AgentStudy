[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-scout"
version = "0.1.0"
description = "A small, reproducible GitHub repository analysis agent for study experiments."
requires-python = ">=3.10"

[project.scripts]
repo-scout = "repo_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

